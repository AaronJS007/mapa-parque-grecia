name: Procesar GPX

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: procesar-gpx
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install gpxpy

      - name: Ejecutar script de procesamiento
        run: python procesar_gpx.py

      - name: Hacer commit de los cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --staged --quiet; then
            echo "No hay cambios para hacer commit"
          else
            git commit -m "Actualización automática: procesar ZIP, actualizar GeoJSON y limpiar repo"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
