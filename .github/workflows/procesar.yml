name: Procesar GPX

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Ejecutar script de procesamiento
        run: python procesar_gpx.py

      # Este paso guardará los cambios automáticamente si el script crea un archivo nuevo
      - name: Hacer commit de los cambios
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Actualización automática de datos" || echo "No hay cambios para hacer commit"
          git push
