<!DOCTYPE html>
<html>
<head>
    <title>Mapa Temático - Parque de Grecia</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100vw; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Coordenadas aproximadas del Parque Central de Grecia, Alajuela
        var map = L.map('map').setView([10.0736, -84.3139], 16);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Aquí luego cargaremos el archivo GeoJSON con los datos
        // fetch('datos.geojson').then(response => response.json()).then(data => {
        //     L.geoJSON(data).addTo(map);
        // });
    </script>
</body>
</html>
